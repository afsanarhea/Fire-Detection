<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Detection</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #8B0000;
        min-height: 100vh;
        color: #fff;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    .header {
        text-align: center;
        margin-bottom: 40px;
    }

    .header h1 {
        font-size: 3rem;
        color: #fff;
        margin-bottom: 10px;
    }

    .header p {
        color: #ffcccc;
        font-size: 1.1rem;
    }

    .upload-box {
        background: rgba(0, 0, 0, 0.2);
        border: 2px dashed #fff;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        margin-bottom: 30px;
    }

    .upload-box h3 {
        margin-bottom: 20px;
        color: #fff;
    }

    .upload-btn {
        background: #fff;
        color: #8B0000;
        padding: 15px 40px;
        border: none;
        border-radius: 30px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: bold;
    }

    .upload-btn:hover {
        background: #ffcccc;
        transform: scale(1.05);
    }

    input[type="file"] {
        display: none;
    }

    .file-name {
        margin-top: 15px;
        color: #ffcccc;
    }

    .predict-btn {
        display: block;
        width: 100%;
        background: #5a0000;
        color: #fff;
        padding: 15px;
        border: 2px solid #fff;
        border-radius: 10px;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 20px;
    }

    .predict-btn:hover {
        background: #400000;
    }

    .result-box {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        margin-top: 30px;
    }

    .result-fire {
        color: #ffff00;
        font-size: 2rem;
        font-weight: bold;
    }

    .result-safe {
        color: #90EE90;
        font-size: 2rem;
        font-weight: bold;
    }

    .confidence {
        margin-top: 15px;
        font-size: 1.2rem;
        color: #ffcccc;
    }

    .preview-img {
        max-width: 300px;
        max-height: 300px;
        border-radius: 10px;
        margin-top: 20px;
        border: 3px solid #fff;
    }

    .uploaded-img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 20px;
            border: 3px solid #fff;
        }

    .footer {
        text-align: center;
        margin-top: 50px;
        color: #ffcccc;
    }

    .footer a {
        color: #fff;
        text-decoration: none;
    }

    .footer a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FIRE DETECTION</h1>
            <p>Forest Fire Detection System</p>
        </div>

        <form action="/predict" method="POST" enctype="multipart/form-data">
            <div class="upload-box">
                <h3>Upload Image</h3>
                <label class="upload-btn">
                    Choose File
                    <input type="file" name="file" id="file" accept="image/*" onchange="showFileName(this)" required>
                </label>
                <p class="file-name" id="fileName">No file selected</p>
                <img id="preview" class="preview-img" style="display:none;">
            </div>

            <button type="submit" class="predict-btn">Detect Fire</button>
        </form>

        {% if result %}
        <div class="result-box">
            {% if image_path %}
            <img src="{{ image_path }}" class="uploaded-img" alt="Uploaded Image">
            {% endif %}
            <p class="{% if 'FIRE' in result %}result-fire{% else %}result-safe{% endif %}">
                {{ result }}
            </p>
            <p class="confidence">Confidence: {{ confidence }}%</p>
        </div>
        {% endif %}

        <div class="footer">
            <p>Dedicated to Protecting Lives & Nature</p>
        </div>
    </div>

    <script>
        function showFileName(input) {
            const fileName = document.getElementById('fileName');
            const preview = document.getElementById('preview');
            
            if (input.files && input.files[0]) {
                fileName.textContent = input.files[0].name;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
